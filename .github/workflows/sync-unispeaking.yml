name: Sync UniSpeaking source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Sync upstream source and Codex overlay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/unispeaking-source /tmp/unispeaking-overrides
          git clone --depth 1 https://github.com/1024XEngineer/UniSpeaking.git /tmp/unispeaking-source
          mkdir -p /tmp/unispeaking-overrides
          cp -a .codex-overrides/. /tmp/unispeaking-overrides/
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/' /tmp/unispeaking-source/ ./
          cp -a /tmp/unispeaking-overrides/. ./
          rm -rf .codex-overrides
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: sync UniSpeaking Qwen runtime and architecture docs" || echo "No changes to commit"
          git push origin HEAD:main
