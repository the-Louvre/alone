name: Agent workspace CI

on:
  pull_request:
    paths:
      - 'frontend/web/**'
      - 'backend/unispeaking-server/**'
      - '.github/workflows/agent-workspace-ci.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/web/**'
      - 'backend/unispeaking-server/**'
      - '.github/workflows/agent-workspace-ci.yml'

permissions:
  contents: read

concurrency:
  group: agent-workspace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run test:checks
      - run: npm test
      - run: npm run build
  backend:
    name: Backend tests and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/unispeaking-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit tests and integration tests
        run: bash mvnw -B -Pci-integration verify
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-backend-test-reports
          path: |
            backend/unispeaking-server/target/surefire-reports/
            backend/unispeaking-server/target/failsafe-reports/
